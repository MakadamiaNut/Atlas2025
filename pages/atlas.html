<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Map Archive - Instant Modal</title>
    <style>
        :root {
            --item-size: 280px;     
            --item-margin: 0px; 
            --ani-speed: 30s; 
            --move-distance: calc((var(--item-size) + (var(--item-margin) * 2)) * 5);
        }

        body { 
            background-color: #000; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
        }
        
        .archive-container { 
            display: flex; 
            flex-direction: column; 
            width: 100%;
            gap: 80px; 
        }

        .row-wrapper { 
            width: 100%; 
            overflow: hidden; 
            white-space: nowrap;
            padding: 20px 0; 
        }

        .row { 
            display: flex; 
            width: max-content; 
        }
        
        .map-item {
            width: var(--item-size); 
            height: var(--item-size); 
            margin: 0 var(--item-margin);
            background-size: cover; 
            background-position: center;
            border-radius: 50%;
            filter: grayscale(100%);
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            transition: transform 0.4s ease, filter 0.3s;
            will-change: transform;
        }

        .clickable .map-item { cursor: pointer; }
        .clickable .map-item:hover { 
            filter: grayscale(0%); 
            transform: scale(1.15); 
            z-index: 999; 
            border-color: #fff;
        }
        
        .non-clickable { opacity: 0.4; }

        .row-left { animation: slideLeft var(--ani-speed) linear infinite; }
        .row-right { animation: slideRight var(--ani-speed) linear infinite; }

        @keyframes slideLeft {
            from { transform: translateX(0); }
            to { transform: translateX(calc(var(--move-distance) * -1)); }
        }

        @keyframes slideRight {
            from { transform: translateX(calc(var(--move-distance) * -1)); }
            to { transform: translateX(0); }
        }

        /* 🖼️ 모달 스타일 수정 */
        #modal { 
            display: none; /* 초기값 */
            position: fixed; 
            top:0; left:0; 
            width:100%; height:100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 2000; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            backdrop-filter: blur(15px);
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center; /* 이미지와 info박스를 가로중앙으로 */
        }

        #modal-img {
            max-width: 80vw;
            max-height: 60vh;
            width: auto;
            height: auto;
            border: 1px solid #444;
            margin-bottom: 15px;
        }

        /* 텍스트 중앙 정렬 핵심 수정부 */
        .modal-info {
            display: flex;
            flex-direction: column;
            align-items: center; /* 내부 요소들 중앙 정렬 */
            text-align: center;
        }

        .modal-info h2 { font-size: 1.8rem; margin: 0 0 10px 0; }
        .modal-info p { color: #888; margin: 4px 0; font-size: 0.85rem; }
        
        /* 설명글 너비 제한 및 중앙 정렬 */
        #m-desc {
            margin: 15px auto 0 !important; /* 가로 중앙 배치 강제 */
        }

    </style>
</head>
<body>

<div class="archive-container">
    <div class="row-wrapper non-clickable">
        <div id="row1" class="row row-left"></div>
    </div>
    <div class="row-wrapper clickable">
        <div id="row2" class="row row-right"></div>
    </div>
    <div class="row-wrapper non-clickable">
        <div id="row3" class="row row-left"></div>
    </div>
</div>

<div id="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modal-img" src="" alt="Map Original">
        <div class="modal-info">
            <h2 id="m-title">Title</h2>
            <p id="m-proj">Projection: -</p>
            <p id="m-desc" style="color:#ccc; max-width: 500px; line-height: 1.5;">Description...</p>
        </div>
    </div>
</div>

<script>
    const mapData = {
        1: { title: "Saved Places Cartogram", proj: "EPSG:3035 (ETRS89 / LAEA Europe)", desc: "구글 지도에 저장된 장소 수에 비례하게 국가별 면적을 왜곡한 카토그램이다." },
        2: { title: "Bristol Channel", proj: "EPSG:27700 (OSGB36 / British National Grid)", desc: "항구도시 브리스톨에서 이름을 딴 이 해협은 조차가 14-15m로 유럽 최대 수준이다." },
        3: { title: "Lacoak: The Harry Potter Trail", proj: "EPSG:27700 (OSGB36 / British National Grid)", desc: "영화 해리포터 2편과 5편에서 Lacoak의 모습을 찾아볼 수 있다." },
        4: { title: "Arctic Circle & Northern Lights Viewing City", proj: "EPSG:3413 (WGS 84 / NSIDC Polar Stereographic)", desc: "노르웨이 트롬쇠는 오로라 관측 명소 중 가장 고위도에 위치해 있다." },
        5: { title: "Mont Blanc Contour", proj: "EPSG:3035 (ETRS89 / LAEA Europe)", desc: "샤모닉스 1030m, 에귀디미디 3842m, 몽블랑 4810m" }
    };

    function createItems(rowId, isClickable) {
        const row = document.getElementById(rowId);
        if(!row) return;
        for (let i = 0; i < 4; i++) {
            for (let j = 1; j <= 5; j++) {
                const item = document.createElement('div');
                item.className = 'map-item';
                const imgUrl = `../assets/img/map${j}.png`;
                item.style.backgroundImage = `url('${imgUrl}')`; 
                
                if (isClickable) {
                    item.onclick = () => openModal(j, imgUrl);
                }
                row.appendChild(item);
            }
        }
    }

    function openModal(id, imgUrl) {
        const data = mapData[id];
        document.getElementById('modal-img').src = imgUrl;
        document.getElementById('m-title').innerText = data.title;
        document.getElementById('m-proj').innerText = `Projection: ${data.proj}`;
        document.getElementById('m-desc').innerText = data.desc;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // 초기화
    window.onload = () => {
        createItems('row1', false);
        createItems('row2', true);
        createItems('row3', false);
    };
</script>

</body>
</html>
